# 拾链 · nginx 配置（覆盖 /etc/nginx/conf.d/default.conf）
#
# 部署形态：nginx 跑在 Docker 里（--network host），后端是宿主机上的 java -jar。
# host 网络模式下容器和宿主机共用网络栈，所以下面反代的 127.0.0.1:8080
# 就是宿主机上那个后端进程 —— 这也是后端能继续保持「只监听 loopback」的原因。
#
# 干两件事：
#   1. 把前端构建产物发出去（dist 是挂载进来的，见 docker run 的 -v）
#   2. 把 /api 反代到后端
#
# 因为前端调接口用的是相对路径 /api，同源部署之后
# **CORS 那套配置在生产里根本用不到**——浏览器眼里只有一个源。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 前端只提交网址和文本，1m 绰绰有余
    client_max_body_size 1m;

    # 静态资源压缩。前端产物是 JS/CSS/SVG，压缩收益很大
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # 带内容哈希的产物可以长期缓存（vite 会把哈希写进文件名）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 接口：反代到宿主机上的后端。
    #
    # proxy_pass 后面**不带路径**，这样原始 URI 原样透传：
    #   /api/meta  →  http://127.0.0.1:8080/api/meta
    # 如果写成 proxy_pass http://127.0.0.1:8080/;（带斜杠），nginx 会把 /api 前缀吃掉，
    # 变成 http://127.0.0.1:8080/meta —— 后端全部 404，而且报错信息看起来像后端的问题。
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        # 这几个头后端要用：X-Forwarded-* 配合 SERVER_FORWARD_HEADERS_STRATEGY=framework，
        # 让后端知道外面是 http 还是 https（影响 cookie 的 Secure 判断和重定向）
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # 一次分析要「抓网页 + 调 AI」，最坏情况能到 40 秒左右
        # （抓取超时 15s + AI 总预算 25s）。默认 60s 有点紧，给足余量。
        proxy_connect_timeout 10s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;

        # 后端重启期间会拿到连接失败，重试一次（单实例时相当于多等一下）
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # 单页应用：前端没有路由库，正常情况下所有视图都从 / 进。
    # 但保留这个兜底——将来加了前端路由，深链接直接刷新才不会 404。
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html 不要缓存，否则前端发新版本后用户拿到的还是旧壳子
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }
}
